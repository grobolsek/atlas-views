[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-views"
version = "0.1.0"
description = "Keep MySQL views in Atlas migration files without Atlas Pro"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymysql>=1.1",
    "cryptography",   # MySQL 8 caching_sha2_password auth
    "docker>=7",      # throwaway MySQL for `atlas-views check`
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
atlas-views = "atlas_views.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
